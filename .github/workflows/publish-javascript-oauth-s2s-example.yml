name: Publish javascript-oauth-s2s-example

on:
  push:
    branches:
      - main
    paths:
      - javascript-oauth-s2s-example/**
      - .github/workflows/publish-javascript-oauth-s2s-example.yml
  pull_request:
    paths:
      - javascript-oauth-s2s-example/**
      - .github/workflows/publish-javascript-oauth-s2s-example.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./javascript-oauth-s2s-example
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/javascript-oauth-s2s-example:latest
            ghcr.io/${{ github.repository_owner }}/javascript-oauth-s2s-example:sha-${{ github.sha }}
